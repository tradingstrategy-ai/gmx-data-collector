name: Full Historical Data Collection (one-time)

# One-time manual trigger only — stores results on data/full-history branch
# under historical/ (separate from the rolling data/daily-collection branch).

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Symbols to collect (comma-separated, e.g. ETH,BTC,LINK — empty = all)'
        required: false
        default: ''
      concurrency:
        description: 'Parallel workers'
        required: false
        default: '10'
      include_funding:
        description: 'Collect funding rates'
        type: boolean
        required: false
        default: true
      include_oi:
        description: 'Collect open interest + pool liquidity'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Data lands under historical/ on a dedicated branch — never touches
  # data/daily-collection or its user_data/ layout.
  DATA_BRANCH: data/full-history
  DATA_ROOT: historical

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout code from master
        uses: actions/checkout@v4
        with:
          ref: master
          path: code

      - name: Check if data branch exists
        id: check-branch
        run: |
          if git ls-remote --exit-code --heads \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "$DATA_BRANCH" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout existing data branch
        if: steps.check-branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DATA_BRANCH }}
          path: data
          fetch-depth: 1

      - name: Create data branch if missing
        if: steps.check-branch.outputs.exists == 'false'
        run: |
          git clone --no-checkout \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$DATA_BRANCH"
          git rm -rf . 2>/dev/null || true
          git commit --allow-empty -m "data: initialize full-history branch"
          git push origin "$DATA_BRANCH"

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'poetry'
          cache-dependency-path: 'code/pyproject.toml'

      - name: Install dependencies
        working-directory: code
        run: poetry install --no-interaction --no-ansi

      - name: Collect candles (full historical)
        working-directory: code
        env:
          JSON_RPC_ARBITRUM: ${{ secrets.JSON_RPC_ARBITRUM }}
          HYPERSYNC_API_TOKEN: ${{ secrets.HYPERSYNC_API_TOKEN }}
        run: |
          SYMBOL_ARG=""
          if [ -n "${{ github.event.inputs.symbols }}" ]; then
            for sym in $(echo "${{ github.event.inputs.symbols }}" | tr ',' ' '); do
              SYMBOL_ARG="$SYMBOL_ARG --symbol $sym"
            done
          fi
          poetry run python -m gmx_historical_data.cli collect \
            --full \
            --output-dir "../data/$DATA_ROOT" \
            --concurrency ${{ github.event.inputs.concurrency }} \
            $SYMBOL_ARG

      - name: Collect funding rates
        if: ${{ github.event.inputs.include_funding == 'true' }}
        working-directory: code
        env:
          HYPERSYNC_API_TOKEN: ${{ secrets.HYPERSYNC_API_TOKEN }}
        run: |
          poetry run python scripts/extract_unified_funding.py \
            --network arbitrum \
            --output-dir "../data/$DATA_ROOT/funding" \
            --output parquet

      - name: Collect open interest
        if: ${{ github.event.inputs.include_oi == 'true' }}
        working-directory: code
        env:
          HYPERSYNC_API_TOKEN: ${{ secrets.HYPERSYNC_API_TOKEN }}
        run: |
          mkdir -p "../data/$DATA_ROOT/data/gmx/open_interest"
          poetry run python scripts/extract_open_interest.py \
            --network arbitrum \
            --output-dir "../data/$DATA_ROOT/data/gmx/open_interest" \
            --output parquet \
            --from-block 120000000

      - name: Collect pool liquidity
        if: ${{ github.event.inputs.include_oi == 'true' }}
        working-directory: code
        env:
          HYPERSYNC_API_TOKEN: ${{ secrets.HYPERSYNC_API_TOKEN }}
        run: |
          mkdir -p "../data/$DATA_ROOT/data/gmx/pool_liquidity"
          poetry run python scripts/extract_pool_liquidity.py \
            --network arbitrum \
            --output-dir "../data/$DATA_ROOT/data/gmx/pool_liquidity" \
            --from-block 120000000

      - name: Export to FreqTrade feather format
        working-directory: code
        run: |
          poetry run python -m gmx_historical_data.cli export-freqtrade \
            --data-dir "../data/$DATA_ROOT" \
            --output-dir "../data/$DATA_ROOT"

      - name: Show disk usage
        if: always()
        run: df -h && du -sh data/$DATA_ROOT/*/  2>/dev/null || true

      - name: Commit and push to data/full-history
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add --force "$DATA_ROOT/" 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: full historical collection $(date -u '+%Y-%m-%d')"
            git pull --rebase origin "$DATA_BRANCH"
            git push origin "$DATA_BRANCH"
          fi
