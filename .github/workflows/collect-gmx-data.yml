name: Daily GMX Data Collection

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC daily (after GMX daily candle close)
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code from master
        uses: actions/checkout@v4
        with:
          ref: master
          path: code

      - name: Check if data branch exists
        id: check-branch
        run: |
          if git ls-remote --exit-code --heads \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            data/daily-collection > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout existing data branch
        if: steps.check-branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: data/daily-collection
          path: data
          fetch-depth: 1

      - name: Create data branch if missing
        if: steps.check-branch.outputs.exists == 'false'
        run: |
          git clone --no-checkout \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data/daily-collection
          git rm -rf . 2>/dev/null || true
          git commit --allow-empty -m "data: initialize daily collection branch"
          git push origin data/daily-collection

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          uv pip install pandas pyarrow polars rich requests eth-utils "web3-ethereum-defi>=1.1"

      - name: Collect daily snapshot
        run: PYTHONPATH=code/src python code/scripts/collect_daily_snapshot.py --output-dir ./data/user_data

      - name: Show report in job summary
        if: always()
        run: |
          if [ -f data/data_report.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat data/data_report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No report generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and push data
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Remove old report location if present
          git rm -f user_data/data_report.txt 2>/dev/null || true
          git add --force \
            user_data/data/gmx/futures/ \
            user_data/data/gmx/snapshots/ \
            user_data/data/gmx/tickers/ \
            user_data/data/gmx/apy/ \
            user_data/data/gmx/volumes/ \
            data_report.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: daily GMX snapshot $(date -u '+%Y-%m-%d')"
            git push origin data/daily-collection
          fi
