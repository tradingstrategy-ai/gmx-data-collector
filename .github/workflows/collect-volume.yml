name: Daily GMX Volume Collection

on:
  schedule:
    - cron: '30 2 * * *'  # 02:30 UTC daily (30 min after main snapshot)
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  collect-volume:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code from master
        uses: actions/checkout@v4
        with:
          ref: master
          path: code

      - name: Check if data branch exists
        id: check-branch
        run: |
          if git ls-remote --exit-code --heads \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            data/daily-collection > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout existing data branch
        if: steps.check-branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: data/daily-collection
          path: data
          fetch-depth: 1

      - name: Skip if no data branch
        if: steps.check-branch.outputs.exists == 'false'
        run: |
          echo "Data branch does not exist yet — run the main collect workflow first."
          exit 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          cache-dependency-glob: 'code/pyproject.toml'

      - name: Install Python dependencies
        run: |
          uv pip install pandas pyarrow polars rich requests eth-utils "web3-ethereum-defi>=1.1"

      - name: Collect 24h volume snapshot
        run: |
          PYTHONPATH=code/src python - <<'EOF'
          import sys
          from datetime import datetime, UTC
          from pathlib import Path
          from gmx_historical_data.subsquid_volume import fetch_daily_volumes
          import pandas as pd

          date_str = datetime.now(UTC).strftime("%Y-%m-%d")
          volumes_dir = Path("./data/user_data/data/gmx/volumes")
          volumes_dir.mkdir(parents=True, exist_ok=True)

          print(f"Fetching 24h volumes for {date_str}...")
          volumes = fetch_daily_volumes(chain="arbitrum")
          if not volumes:
              print("No volume data returned.")
              sys.exit(0)

          rows = [{"date": date_str, "market_address": addr, "volume_usd": str(vol)} for addr, vol in volumes.items()]
          df = pd.DataFrame(rows)
          out = volumes_dir / f"{date_str}.parquet"
          df.to_parquet(out, index=False)
          print(f"Saved {len(df)} markets -> {out}")
          EOF

      - name: Commit and push volume data
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force user_data/data/gmx/volumes/
          if git diff --cached --quiet; then
            echo "No volume data to commit"
          else
            git commit -m "data: daily GMX volume snapshot $(date -u '+%Y-%m-%d')"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin data/daily-collection
              if git push origin data/daily-collection; then
                echo "Pushed on attempt $attempt"
                break
              fi
              echo "Push attempt $attempt failed, retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
              if [ "$attempt" -eq 5 ]; then
                echo "All push attempts failed"
                exit 1
              fi
            done
          fi
