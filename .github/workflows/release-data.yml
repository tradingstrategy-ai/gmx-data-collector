name: Release GMX Daily Data

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Delete releases older than this many days (default: 14).'
        required: false
        default: '14'
      allow_fresh_seed:
        description: 'Allow starting without a previous data release. Only use for the first seed release.'
        required: false
        default: 'false'
      repair_ohlcv:
        description: 'Re-fetch MAX_CANDLE_LIMIT candles and merge to fill interior 1m holes (2026-09-08 02:17). Off on the daily cron.'
        required: false
        default: 'false'
      repair_timeframes:
        description: 'With repair_ohlcv=true: comma-separated timeframes to re-fetch (e.g. 1d,4h). Empty = all timeframes.'
        required: false
        default: ''
      seed_funding_from:
        description: 'One-off: seed the raw funding state from this branch (data/full-history) when no funding state exists yet. Leave empty on every other run.'
        required: false
        default: ''

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Shared with funding-catchup.yml: both read the newest funding state asset at
# the start and write a newer one at the end, so running together would lose
# one side's progress. A running job is never cancelled, and with `queue: max` pending
# runs are queued and processed sequentially instead of being replaced (up to 100 per
# group; GitHub changelog 2026-05-07).
concurrency:
  group: gmx-funding-state
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # ``contents: write`` is what publishing the release itself needs.
    # ``issues: write`` is the one extra grant: a surviving cadence
    # regression files (or comments on) a tracking issue rather than
    # silently shipping a new hole.
    permissions:
      contents: write
      issues: write

    steps:
      # Do not pin checkout to the default branch: scheduled runs already
      # fire there, and ``workflow_dispatch --ref <branch>`` must collect
      # with that branch's collector or a dispatch still ships the hole
      # this job exists to catch.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          cache-dependency-glob: 'requirements-collector.txt'

      - name: Install Python dependencies
        run: |
          # Generated from poetry.lock by scripts/export_requirements.py, not
          # hand-written: a hand-maintained list drifted from what the code
          # imports and killed two scheduled releases at import time
          # (2026-09-11/12). The notebook stack lives in an optional Poetry
          # group, so this stays to the collector's own dependencies.
          uv pip install -r requirements-collector.txt

      - name: Restore previous release data
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_FRESH_SEED: ${{ github.event.inputs.allow_fresh_seed || 'false' }}
        run: |
          mkdir -p user_data
          TMPDIR=$(mktemp -d)

          PREVIOUS_TAG=$(gh release list \
              --repo ${{ github.repository }} \
              --limit 100 \
              --json tagName \
              --jq '[.[].tagName | select(test("^data-[0-9]{4}-[0-9]{2}-[0-9]{2}$"))] | sort | reverse | .[0] // ""')

          # Later steps need to name the release this run is measured against
          # (the cadence gate records it as `regressed_from`).
          echo "PREVIOUS_TAG=${PREVIOUS_TAG}" >> "$GITHUB_ENV"

          if [ -z "${PREVIOUS_TAG}" ]; then
            if [ "${ALLOW_FRESH_SEED}" = "true" ]; then
              echo "No prior data release exists; allow_fresh_seed=true, continuing with an empty seed."
              rm -rf "${TMPDIR}"
              exit 0
            fi
            echo "ERROR: no prior data release found. Refusing to publish a fresh incomplete snapshot." >&2
            echo "Use workflow_dispatch with allow_fresh_seed=true only for the first seed release." >&2
            exit 1
          fi

          echo "Downloading gmx-full.tar.gz from ${PREVIOUS_TAG}..."
          if gh release download \
              "${PREVIOUS_TAG}" \
              --repo ${{ github.repository }} \
              --pattern "gmx-full.tar.gz" \
              --dir "${TMPDIR}" \
              --clobber; then
              tar -xzf "${TMPDIR}/gmx-full.tar.gz" -C .
              find user_data -name '._*' -delete 2>/dev/null || true
              COUNT=$(find user_data -type f 2>/dev/null | wc -l | tr -d ' ')
              echo "Restored ${COUNT} files from ${PREVIOUS_TAG}."
          else
              echo "ERROR: failed to restore gmx-full.tar.gz from ${PREVIOUS_TAG}." >&2
              exit 1
          fi
          rm -rf "${TMPDIR}"

      # The raw funding state (raw events, rebuilt rates, direction, checkpoints)
      # is what lets `extract_unified_funding.py --resume` be incremental; without
      # its checkpoints it walks from genesis, which takes longer than this whole
      # job. It travels in its own asset so it does not eat gmx-full's 2 GiB cap.
      #
      # Fail-soft like the ticks (#48): an absent or unrestorable state never stops
      # the release, it only means the funding companions are withheld by the gate
      # below. The newest retained release that carries the asset is used, so one
      # run that published without it does not lose the state. The archive is
      # unpacked beside the tree and moved in whole, so a failed restore can never
      # leave a half-restored funding/ directory that would then be re-published.
      # The shell is shared with funding-catchup.yml (scripts/funding_state_assets.sh).
      - name: Restore funding state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/funding_state_assets.sh restore

      # One-off, workflow_dispatch only: copy the raw funding sources from the
      # data/full-history branch and derive the checkpoints the branch never
      # stored. Never replaces a restored state (that is newer than any seed).
      - name: Seed funding state
        if: ${{ github.event.inputs.seed_funding_from != '' }}
        env:
          SEED_REF: ${{ github.event.inputs.seed_funding_from }}
        run: |
          PYTHONPATH=src python scripts/release_funding_companions.py seed \
              --gmx-root user_data/data/gmx --ref "${SEED_REF}"

      - name: Preflight funding state
        run: |
          PYTHONPATH=src python scripts/release_funding_companions.py state \
              --gmx-root user_data/data/gmx

      # A delisted market (e.g. OM) keeps the history it accumulated while it was
      # live -- collection stops at delisting and the series simply freezes there.
      # Its files are NOT removed: they ride the release lineage so consumers keep
      # the full record. They are only excluded from the integrity gate, because
      # frozen history cannot be repaired by a future collection run and would
      # otherwise block every release forever.
      #
      # The roster lives inside the dataset so it survives release-to-release and
      # still works when the registry API is unreachable. Relisted markets drop
      # back off the roster and resume validation.
      - name: Record delisted markets
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          import re
          from datetime import UTC, datetime
          from pathlib import Path

          from gmx_historical_data.market_registry import get_disabled_market_symbols

          gmx_dir = Path("./user_data/data/gmx")
          futures_dir = gmx_dir / "futures"
          roster_path = gmx_dir / "delisted_markets.json"

          previous: set[str] = set()
          if roster_path.exists():
              previous = {s.upper() for s in json.loads(roster_path.read_text())["symbols"]}

          pattern = re.compile(r"^(.+?)_[^_]+_[^_]+-(?:1m|5m|15m|1h|4h|1d)-")
          symbols = set()
          if futures_dir.is_dir():
              for path in futures_dir.iterdir():
                  match = pattern.match(path.name)
                  if match:
                      symbols.add(match.group(1).upper())

          candidates = sorted(symbols | previous)
          try:
              disabled = {s.upper() for s in get_disabled_market_symbols(candidate_symbols=candidates)}
              live = {s for s in candidates if s not in disabled}
              # Union in the newly delisted, and let anything relisted fall back off.
              roster = sorted((previous | disabled) - live)
              for symbol in sorted(disabled - previous):
                  print(f"newly delisted, freezing history: {symbol}")
              for symbol in sorted(previous & live):
                  print(f"relisted, resuming validation: {symbol}")
          except Exception as exc:  # noqa: BLE001 - never block a release on registry flakiness
              print(f"::warning::registry unreachable ({exc}); reusing previous roster.")
              roster = sorted(previous)

          # The roster below is rewritten *before* collection, and a market
          # that just relisted drops off it at that moment -- which is
          # exactly the run whose relisting seam the cadence gate must not
          # flag. Keep the pre-rewrite roster so that one run is exempt.
          Path("/tmp/gmx-delisted-baseline.json").write_text(
              json.dumps({"symbols": sorted(previous)}, indent=2), encoding="utf-8"
          )

          gmx_dir.mkdir(parents=True, exist_ok=True)
          roster_path.write_text(
              json.dumps(
                  {"symbols": roster, "updated": datetime.now(UTC).strftime("%Y-%m-%d")},
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          print(f"Delisted roster ({len(roster)}): {', '.join(roster) or '(none)'}")
          print(f"Their history is retained and republished; excluded from the integrity gate only.")
          PY

      - name: Snapshot restored candle history
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          import sys
          from pathlib import Path

          import pandas as pd

          futures_dir = Path("./user_data/data/gmx/futures")
          baseline = {}

          for path in sorted(futures_dir.glob("*.feather")):
              df = pd.read_feather(path, columns=["date"])
              if df.empty:
                  continue
              dates = pd.to_datetime(df["date"], utc=True)
              baseline[path.name] = {
                  "rows": int(len(df)),
                  "min_date": dates.min().isoformat(),
                  "max_date": dates.max().isoformat(),
              }

          if not baseline:
              print("ERROR: restored release contains no candle history to validate.", file=sys.stderr)
              sys.exit(1)

          Path("/tmp/gmx-restore-manifest.json").write_text(
              json.dumps(baseline, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(f"Captured restore manifest for {len(baseline)} futures files.")
          PY

      # Must run BEFORE collection: this run regenerates the manifest in place,
      # so the previous release's copy has to be taken off disk first or there
      # is nothing left to diff against.
      - name: Snapshot restored cadence manifest
        run: |
          BASELINE=./user_data/data/gmx/futures/_cadence_manifest.json
          if [ -f "$BASELINE" ]; then
            cp "$BASELINE" /tmp/gmx-cadence-baseline.json
            echo "Captured cadence baseline from the previous release."
          else
            echo '{"files": {}}' > /tmp/gmx-cadence-baseline.json
            echo "No cadence manifest in the previous release; first run after rollout."
          fi

      - name: Collect daily snapshot
        env:
          JSON_RPC_ARBITRUM: ${{ secrets.JSON_RPC_ARBITRUM }}
          HYPERSYNC_API_TOKEN: ${{ secrets.HYPERSYNC_API_TOKEN }}
          REPAIR_TIMEFRAMES: ${{ github.event.inputs.repair_timeframes }}
        run: |
          ARGS=(--output-dir ./user_data --prune-report /tmp/gmx-prune-report.json)
          if [ "${{ github.event.inputs.repair_ohlcv }}" = "true" ]; then
            ARGS+=(--repair-ohlcv)
            echo "repair_ohlcv=true: filling interior holes with MAX_CANDLE_LIMIT"
            # Free-text input: drop whitespace, then allow only [0-9a-z,] so it
            # stays one plain argument and can never inject an option.
            TIMEFRAMES="${REPAIR_TIMEFRAMES//[[:space:]]/}"
            if [ -n "$TIMEFRAMES" ]; then
              if ! [[ "$TIMEFRAMES" =~ ^[0-9a-z,]+$ ]]; then
                echo "ERROR: repair_timeframes must look like 1d,4h (got: $REPAIR_TIMEFRAMES)" >&2
                exit 1
              fi
              ARGS+=(--repair-timeframes "$TIMEFRAMES")
              echo "repair_timeframes=$TIMEFRAMES"
            fi
          fi
          PYTHONPATH=src python scripts/collect_daily_snapshot.py "${ARGS[@]}"

      - name: Validate candle history integrity
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          import sys
          from pathlib import Path

          import pandas as pd

          baseline_path = Path("/tmp/gmx-restore-manifest.json")
          if not baseline_path.exists():
              print("ERROR: missing restore manifest; cannot validate candle history.", file=sys.stderr)
              sys.exit(1)

          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          prune_path = Path("/tmp/gmx-prune-report.json")
          pruned = (
              json.loads(prune_path.read_text(encoding="utf-8")) if prune_path.exists() else {}
          )
          futures_dir = Path("./user_data/data/gmx/futures")
          current = {}

          for path in sorted(futures_dir.glob("*.feather")):
              df = pd.read_feather(path, columns=["date"])
              if df.empty:
                  continue
              dates = pd.to_datetime(df["date"], utc=True)
              current[path.name] = {
                  "rows": int(len(df)),
                  "min_date": dates.min().isoformat(),
                  "max_date": dates.max().isoformat(),
              }

          regressions = []

          missing_files = sorted(set(baseline) - set(current))
          if missing_files:
              regressions.append(
                  "missing futures files after collection: " + ", ".join(missing_files[:5])
                  + (" ..." if len(missing_files) > 5 else "")
              )

          for name, before in baseline.items():
              after = current.get(name)
              if not after:
                  continue
              # The collector never stores a bar that has not closed yet and records
              # every open row it prunes; tolerate exactly those rows, nothing else.
              tolerated = len(pruned.get(name, []))
              if after["rows"] < before["rows"] - tolerated:
                  regressions.append(
                      f"{name} row count shrank from {before['rows']} to {after['rows']}"
                  )
              if after["min_date"] > before["min_date"]:
                  regressions.append(
                      f"{name} earliest candle moved forward from {before['min_date']} to {after['min_date']}"
                  )

          report = Path("data_report.txt").read_text(encoding="utf-8") if Path("data_report.txt").exists() else ""
          if "## Failed OHLCV Fetches" in report:
              regressions.append("collector reported failed OHLCV fetches")

          if regressions:
              print("ERROR: release integrity check failed.", file=sys.stderr)
              for item in regressions:
                  print(f"  - {item}", file=sys.stderr)
              sys.exit(1)

          print(f"Validated {len(current)} futures files with no regressions.")
          PY

      - name: Validate futures candle file integrity
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          gmx_dir = Path("./user_data/data/gmx")
          futures_dir = gmx_dir / "futures"
          roster_path = gmx_dir / "delisted_markets.json"

          delisted: set[str] = set()
          if roster_path.exists():
              delisted = {s.upper() for s in json.loads(roster_path.read_text())["symbols"]}

          # Delisted markets keep their frozen history in the release but are not
          # gated on it: collection has stopped, so nothing can ever repair a defect
          # sitting in that frozen tail, and gating on it would block every release.
          pattern = re.compile(r"^(.+?)_[^_]+_[^_]+-(?:1m|5m|15m|1h|4h|1d)-")
          files, skipped = [], 0
          for path in sorted(futures_dir.glob("*-futures.*")):
              if path.suffix not in {".feather", ".parquet"}:
                  continue
              match = pattern.match(path.name)
              if match and match.group(1).upper() in delisted:
                  skipped += 1
                  continue
              files.append(str(path))

          if skipped:
              print(f"Skipping {skipped} file(s) for delisted markets: {', '.join(sorted(delisted))}")

          if not files:
              print("ERROR: no futures candle files found for integrity validation.", file=sys.stderr)
              sys.exit(1)

          cmd = [sys.executable, "scripts/validate_price_continuity.py", "--allow-gaps", *files]
          raise SystemExit(subprocess.call(cmd))
          PY

      # The release pipeline writes its futures feathers via
      # scripts/collect_daily_snapshot.py, not via `export-freqtrade`, so the
      # manifest that FreqtradeExporter.export_candles publishes for local
      # exports is regenerated here from the files actually about to ship.
      # It lands inside gmx-full.tar.gz because the packaging step below tars
      # user_data/data/gmx/ wholesale (issue #29).
      #
      # The logic lives in src/gmx_historical_data/cadence_gate.py rather than
      # in a heredoc here: an inline script cannot be unit-tested, and the
      # first cut of this gate shipped a suppression rule that silently
      # excluded every fresh outage -- the exact defect it exists to catch.
      # See tests/test_cadence_gate.py.
      - name: Generate cadence manifest
        run: |
          PYTHONPATH=src python -m gmx_historical_data.cadence_gate build \
              --futures-dir ./user_data/data/gmx/futures

      # Detection runs BEFORE packaging/publishing on purpose. A surviving
      # regression does NOT block the release -- starving every consumer of a
      # day of data because one symbol regressed is worse than shipping the
      # regression with a label on it. Instead the offending manifest entry is
      # annotated with `regressed_from`, an issue is filed, and a flag defers
      # the job's failure to the very last step, after publish has succeeded.
      - name: Validate candle cadence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Retry re-runs the read-and-diff only, never collection or export:
          # a genuine regression is deterministic and would fail all three
          # attempts identically, so the retry exists purely to absorb a
          # transient read/JSON failure without misreporting it as a data
          # regression. Re-running the export here would mutate published
          # history mid-release for no benefit. Exit 2 = real regression,
          # exit 1 = the check could not run.
          STATUS=0
          for attempt in 1 2 3; do
            set +e
            PYTHONPATH=src python -m gmx_historical_data.cadence_gate check \
                --baseline /tmp/gmx-cadence-baseline.json \
                --manifest ./user_data/data/gmx/futures/_cadence_manifest.json \
                --regressions /tmp/gmx-cadence-regressions.json \
                --delisted-roster ./user_data/data/gmx/delisted_markets.json \
                --delisted-roster /tmp/gmx-delisted-baseline.json
            STATUS=$?
            set -e
            if [ "$STATUS" -eq 0 ]; then
              echo "Cadence check attempt $attempt succeeded."
              break
            fi
            echo "Cadence check attempt $attempt failed (exit ${STATUS})."
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done

          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi

          if [ "$STATUS" -ne 2 ]; then
            echo "ERROR: cadence check could not run after 3 attempts." >&2
            exit 1
          fi

          # Set the flag FIRST. Everything below is best-effort reporting,
          # and this step runs before packaging: if any of it failed under
          # `set -e` the release itself would be blocked, which is the
          # fail-closed behaviour this whole design exists to avoid. The
          # job still ends red because the last step reads this flag.
          echo "CADENCE_REGRESSION_DETECTED=true" >> "$GITHUB_ENV"
          echo "::warning::New cadence break(s) detected; the release will publish and the job will end red."

          PYTHONPATH=src python -m gmx_historical_data.cadence_gate annotate \
              --manifest ./user_data/data/gmx/futures/_cadence_manifest.json \
              --regressions /tmp/gmx-cadence-regressions.json \
              --previous-tag "${PREVIOUS_TAG:-unknown}" \
            || echo "WARNING: could not annotate the cadence manifest; the flag is still set." >&2

          REPO=${{ github.repository }}
          RUN_URL="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
          DATE=$(date -u +%Y-%m-%d)

          # One ticket per incident (the whole regressions list), not one
          # per file. A fleet-wide outage used to open 10 alphabetical
          # duplicates (#33–#42) whose bodies all listed the same 50 markets.
          PYTHONPATH=src python -m gmx_historical_data.cadence_issue format \
              --regressions /tmp/gmx-cadence-regressions.json \
              --previous-tag "${PREVIOUS_TAG:-unknown}" \
              --run-url "$RUN_URL" \
              --date "$DATE" \
              --out /tmp/gmx-cadence-incident.json \
            || echo "WARNING: could not format the cadence incident issue." >&2

          TITLE=$(PYTHONPATH=src python -c "import json,sys;print(json.load(open(sys.argv[1]))['title'])" /tmp/gmx-cadence-incident.json || echo "cadence regression — ${DATE}")
          BODY=$(PYTHONPATH=src python -c "import json,sys;print(json.load(open(sys.argv[1]))['body'])" /tmp/gmx-cadence-incident.json || echo "(incident body unavailable) <!-- cadence-regression-incident:${DATE} -->")

          # Fetch the open ticket list ONCE, with bodies, and match on the
          # exact hidden marker. `gh issue list --search` tokenises, and
          # every candle filename shares `usdc`/`futures`/`feather` and a
          # timeframe token with every other one, so relevance ranking can
          # hand back a different symbol's ticket and we would comment on it.
          gh issue list --repo "$REPO" --state open --limit 200 --json number,body \
              > /tmp/gmx-open-issues.json 2>/dev/null || echo '[]' > /tmp/gmx-open-issues.json

          EXISTING=$(PYTHONPATH=src python -m gmx_historical_data.cadence_issue find-issue \
              --issues /tmp/gmx-open-issues.json --date "$DATE" || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY" \
              || echo "WARNING: could not comment on issue #${EXISTING}" >&2
            echo "Commented on existing incident issue #${EXISTING}."
          else
            gh issue create --repo "$REPO" \
                --title "$TITLE" \
                --assignee Aviksaikat \
                --label bug \
                --body "$BODY" \
              || echo "WARNING: could not file the cadence incident issue" >&2
          fi

          echo "Cadence regression recorded; the release will publish and the job will end red."

      - name: Collect 24h volume snapshot
        run: |
          PYTHONPATH=src python - <<'EOF'
          import sys
          from datetime import datetime, UTC
          from pathlib import Path
          from gmx_historical_data.subsquid_volume import fetch_daily_volumes
          import pandas as pd

          date_str = datetime.now(UTC).strftime("%Y-%m-%d")
          volumes_dir = Path("./user_data/data/gmx/volumes")
          volumes_dir.mkdir(parents=True, exist_ok=True)

          print(f"Fetching 24h volumes for {date_str}...")
          volumes = fetch_daily_volumes(chain="arbitrum")
          if not volumes:
              print("No volume data returned.")
              sys.exit(0)

          rows = [{"date": date_str, "market_address": addr, "volume_usd": str(vol)} for addr, vol in volumes.items()]
          df = pd.DataFrame(rows)
          out = volumes_dir / f"{date_str}.parquet"
          df.to_parquet(out, index=False)
          print(f"Saved {len(df)} markets -> {out}")
          EOF

      # `generate_report` (the "Collect daily snapshot" step above) runs
      # before this job's own volume fetch, so it always writes placeholder
      # volume fields into data_report.txt (see the `volume_count,
      # volume_data = 0, {}` comment in collect_daily_snapshot.main). This
      # patches the already-written report with what the step above just
      # saved to volumes/{date}.parquet, so the *shipped* report never says
      # "Volume entries: 0 markets" on a day volume was actually collected.
      #
      # `if: always()`: if "Collect 24h volume snapshot" itself raises
      # (rather than exiting 0 with no rows, which it already handles), the
      # default `success()` condition would skip this step entirely and the
      # report would still ship the fabricated placeholder. With no
      # volumes/{date}.parquet on disk either way, refresh_volume_report_section
      # reports "not collected" -- an honest fail-soft answer, not another zero.
      - name: Refresh report with 24h volume data
        if: always()
        run: |
          PYTHONPATH=src:scripts python - <<'EOF'
          from datetime import datetime, UTC
          from pathlib import Path
          from collect_daily_snapshot import refresh_volume_report_section

          date_str = datetime.now(UTC).strftime("%Y-%m-%d")
          refresh_volume_report_section(
              report_path=Path("data_report.txt"),
              volumes_dir=Path("./user_data/data/gmx/volumes"),
              snapshots_dir=Path("./user_data/data/gmx/snapshots"),
              date_str=date_str,
          )
          EOF

      # Hourly funding + mark companions (#56). Contract, mirroring the #48 tick
      # phase: fail-closed for *publishing* the companions, fail-soft for the rest
      # of the release.
      #
      #   extract -> stage -> gate -> promote
      #
      # The new files are built in user_data/.companion-stage, graded per pair, and
      # copied over futures/ only on a pass. On a fail futures/ keeps the companions
      # it was restored with (the last ones that passed), funding_coverage.json
      # says WITHHELD, and the last step below turns the job red -- but the release
      # still publishes. Nothing here ever deletes or edits funding/ state.
      - name: Extract funding (incremental)
        id: funding_extract
        if: ${{ env.FUNDING_STATE == 'ready' }}
        continue-on-error: true
        timeout-minutes: ${{ github.event.inputs.seed_funding_from != '' && 30 || 15 }}
        env:
          JSON_RPC_ARBITRUM: ${{ secrets.JSON_RPC_ARBITRUM }}
          HYPERSYNC_API_TOKEN: ${{ secrets.HYPERSYNC_API_TOKEN }}
        run: |
          PYTHONPATH=src python scripts/extract_unified_funding.py \
              --network arbitrum \
              --output-dir user_data/data/gmx/funding \
              --output parquet \
              --resume

      - name: Stage funding and mark companions
        id: funding_stage
        if: ${{ env.FUNDING_STATE == 'ready' && steps.funding_extract.outcome == 'success' }}
        continue-on-error: true
        run: |
          PYTHONPATH=src python scripts/release_funding_companions.py export \
              --gmx-root user_data/data/gmx \
              --stage-dir user_data/.companion-stage

      - name: Gate and promote funding companions
        if: always()
        env:
          EXTRACT_OUTCOME: ${{ steps.funding_extract.outcome }}
          STAGE_OUTCOME: ${{ steps.funding_stage.outcome }}
        run: |
          # A partial staging directory must never be graded as if it were whole.
          if [ "${STAGE_OUTCOME}" != "success" ]; then
            rm -rf user_data/.companion-stage
          fi
          RUN_START="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          RC=0
          PYTHONPATH=src python scripts/release_funding_companions.py gate \
              --gmx-root user_data/data/gmx \
              --stage-dir user_data/.companion-stage \
              --state "${FUNDING_STATE:-absent}" \
              --extract-outcome "${EXTRACT_OUTCOME:-skipped}" \
              --run-start "${RUN_START}" \
              --report data_report.txt || RC=$?
          # Whatever the gate did (an uncaught exception also exits 1, like a
          # legitimate WITHHELD): unless it wrote a verdict stamped with this
          # run's start, the verdict restored from the previous release must not
          # stand. Replace it with WITHHELD / NOT refreshed. futures/ is untouched
          # either way: promotion only happens inside a passing gate.
          PYTHONPATH=src python scripts/release_funding_companions.py ensure-verdict \
              --gmx-root user_data/data/gmx \
              --state "${FUNDING_STATE:-absent}" \
              --extract-outcome "${EXTRACT_OUTCOME:-skipped}" \
              --run-start "${RUN_START}" \
              --exit-code "${RC}" \
              --report data_report.txt || {
            if [ "${RC}" -gt 1 ] || [ ! -f user_data/data/gmx/funding_coverage.json ]; then
              rm -f user_data/data/gmx/funding_coverage.json
              echo "FUNDING_GATE=fail" >> "$GITHUB_ENV"
            fi
          }
          rm -rf user_data/.companion-stage
          exit 0

      # Every data type the bundle is supposed to carry, checked before it
      # ships. The release reports "success" from step exit codes alone, so
      # without this a phase that produced nothing still publishes a bundle
      # silently missing that type -- the shape behind both #47 and #48.
      # Types marked `required=False` (ticks, tick_volume, volumes) are
      # reported but never block: the trade-tick phase is deliberately
      # fail-soft and turning its absence into a failed release would undo
      # the contract #48 restored.
      - name: Validate data type coverage
        run: |
          PYTHONPATH=src python - <<'PY'
          import sys
          from pathlib import Path

          from gmx_historical_data.data_coverage import (
              assess_coverage,
              blocking_entries,
              failing_entries,
              format_coverage_report,
          )

          entries = assess_coverage(Path("user_data/data/gmx"))
          print(format_coverage_report(entries))

          degraded = [e for e in failing_entries(entries) if not e.required]
          if degraded:
              names = ", ".join(e.name for e in degraded)
              print(f"\n::warning::data types absent or stale (non-blocking): {names}")

          blocking = blocking_entries(entries)
          if blocking:
              names = ", ".join(f"{e.name}={e.status.value}" for e in blocking)
              print(f"\n::error::release is missing required data: {names}", file=sys.stderr)
              sys.exit(1)

          print("\nEvery required data type is present and current.")
          PY

      - name: Show report in job summary
        if: always()
        run: |
          if [ -f data_report.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat data_report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No report generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Package tarballs
        run: |
          set -e
          if [ ! -d user_data/data/gmx ]; then
            echo "user_data/data/gmx/ missing after collection — aborting" >&2
            exit 1
          fi

          # tick_volume/ and ticks/ are absent whenever the trade-tick phase
          # skipped (no HyperSync key, or an outage), and tar fails on a
          # missing path -- so create them before packaging either bundle.
          mkdir -p user_data/data/gmx/volumes
          mkdir -p user_data/data/gmx/tick_volume
          mkdir -p user_data/data/gmx/ticks

          # The raw funding state ships as its own asset (gmx-funding-state-*), not
          # in gmx-full: it is ~0.6 GiB of parquet that does not compress and
          # would eat the 2 GiB asset cap. gmx-full keeps only the derived
          # futures/*-1h-funding_rate, *-1h_datastore-funding_rate and *-1h-mark feathers and the coverage
          # record. The state is packaged exactly as it is on disk, whatever the
          # gate decided -- a withheld day still carries it forward.
          tar -czf /tmp/gmx-full.tar.gz \
              --exclude='user_data/data/gmx/funding' \
              user_data/data/gmx/
          # Unique name per run: the release step uploads it beside any older
          # state asset and deletes those only once this one is confirmed.
          bash scripts/funding_state_assets.sh pack /tmp/

          # The light bundle carries per-symbol volume (small aggregates) but
          # not the raw tick tape, which is per-fill and grows without bound.
          # It never carried OHLCV, so it still has no candles and no mark (mark
          # is derived from them): full is the backtest bundle. It does carry the
          # small hourly funding_rate feathers and the coverage record, which are
          # useful without candles. Both come from futures/, so a withheld day
          # ships the previous release's funding files here as well.
          LIGHT_LIST=$(mktemp)
          for d in apy snapshots tickers volumes tick_volume; do
            printf '%s\0' "user_data/data/gmx/${d}/" >> "$LIGHT_LIST"
          done
          find user_data/data/gmx/futures -maxdepth 1 \
              \( -name '*-1h-funding_rate.feather' -o -name '*-1h_datastore-funding_rate.feather' \) \
              -print0 >> "$LIGHT_LIST"
          if [ -f user_data/data/gmx/funding_coverage.json ]; then
            printf '%s\0' user_data/data/gmx/funding_coverage.json >> "$LIGHT_LIST"
          fi
          tar -czf /tmp/gmx-light.tar.gz --null -T "$LIGHT_LIST"
          rm -f "$LIGHT_LIST"

          PYTHONPATH=src python -m gmx_historical_data.tick_release build \
              --root user_data/data/gmx --output /tmp

          ls -lh /tmp/gmx-*.tar.gz

          # Asset size guardrails: warn from 1.8 GiB, refuse at the 2 GiB cap.
          for tarball in /tmp/gmx-full.tar.gz /tmp/gmx-light.tar.gz /tmp/gmx-ticks.tar.gz /tmp/gmx-funding-state-*.tar.gz; do
            [ -f "$tarball" ] || continue
            size=$(stat -c %s "$tarball")
            warn=$((1800 * 1024 * 1024))
            limit=$((2 * 1024 * 1024 * 1024))  # 2 GB
            if [ "$size" -ge "$limit" ]; then
              echo "ERROR: $tarball is ${size} bytes — exceeds 2 GB GitHub asset cap" >&2
              exit 1
            elif [ "$size" -ge "$warn" ]; then
              echo "::warning::$tarball is ${size} bytes — within 10% of the 2 GB GitHub asset cap"
            fi
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          TAG="data-${DATE}"
          COUNT=$(find user_data/data/gmx -type f 2>/dev/null | wc -l | tr -d ' ')

          # Same-date reruns preserve all consumer assets and append only the
          # verified funding-state successor and immutable tick revision. Never
          # delete/recreate the release or clobber full/light/report/tick assets.
          MODE=create
          if ! TAGS=$(gh release list --repo ${{ github.repository }} --limit 100 --json tagName \
              --jq '.[].tagName'); then
            echo "ERROR: could not inspect releases; refusing to publish into an unknown tag state." >&2
            exit 1
          elif printf '%s\n' "${TAGS}" | grep -qx "${TAG}"; then
            MODE=in_place
            echo "${TAG} already exists; preserving its consumer assets and adding funding/tick assets only."
          fi

          NOTES_FILE=$(mktemp)
          cat > "$NOTES_FILE" <<NOTES
          Daily automated GMX data snapshot.

          **Generated:** ${TIMESTAMP} UTC

          Contents (${COUNT} files total):
          - \`gmx-full.tar.gz\` — apy/, snapshots/, tickers/, volumes/, tick_volume/, ticks/, checkpoints/, futures/ (OHLCV + 1h funding_rate + 1h_datastore funding_rate + 1h mark + _cadence_manifest.json), funding_coverage.json, delisted_markets.json. The backtest bundle.
          - \`gmx-light.tar.gz\` — apy/, snapshots/, tickers/, volumes/, tick_volume/, futures/*-1h-funding_rate.feather, futures/*-1h_datastore-funding_rate.feather, funding_coverage.json (no OHLCV, no mark)
          - \`gmx-funding-state-<timestamp>.tar.gz\` — raw funding state carried between daily runs; not a consumer artifact
          - \`gmx-ticks[.rN].tar.gz\` + matching manifest — Arbitrum execution tape, volume and coverage/checksums; same-date tick revisions may be newer than full/light
          - \`data_report.txt\` — collection summary

          Consume with \`scripts/download_gmx_data.sh\` (see repo README).
          NOTES

          # Per-asset OHLCV coverage table (Asset/Timeframe/From/To/Candles),
          # matching the sibling Apex-Historical-Data release notes.
          PYTHONPATH=src python -m gmx_historical_data.release_notes build \
              --futures-dir ./user_data/data/gmx/futures \
              --out /tmp/gmx-coverage-table.md
          printf '\n' >> "$NOTES_FILE"
          cat /tmp/gmx-coverage-table.md >> "$NOTES_FILE"

          # Always say whether funding was refreshed, and list every lagging or
          # stale market -- never leave a consumer to infer it.
          printf '\n' >> "$NOTES_FILE"
          PYTHONPATH=src python scripts/release_funding_companions.py notes \
              --coverage user_data/data/gmx/funding_coverage.json >> "$NOTES_FILE"

          CONSUMER=()
          if [ "${MODE}" = "create" ]; then
            CONSUMER=(/tmp/gmx-full.tar.gz /tmp/gmx-light.tar.gz)
            if [ -f data_report.txt ]; then
              CONSUMER+=(data_report.txt)
            fi
          fi
          STATE_FILE=$(ls /tmp/gmx-funding-state-*.tar.gz 2>/dev/null | sort | tail -1 || true)
          STATE_ARGS=()
          if [ -n "${STATE_FILE}" ]; then
            STATE_ARGS=("${STATE_FILE}")
          fi

          FAILED=0
          update_in_place() {
            # Existing consumer assets and the original release body are
            # immutable on a same-date rerun. Only the uniquely named state
            # successor and numbered tick pair may be appended.
            if [ -n "${STATE_FILE}" ]; then
              bash scripts/funding_state_assets.sh publish "${TAG}" "${STATE_FILE}" \
                  || FAILED=1
            fi
          }

          if [ "${MODE}" = "in_place" ]; then
            update_in_place
          elif ! gh release create "${TAG}" \
              --repo ${{ github.repository }} \
              --title "GMX Data ${DATE}" \
              --notes-file "$NOTES_FILE" \
              --latest \
              "${CONSUMER[@]}" "${STATE_ARGS[@]}"; then
            FAILED=1
          fi

          if [ "${FAILED}" = "0" ]; then
            PYTHONPATH=src python -m gmx_historical_data.tick_release publish \
                --repo ${{ github.repository }} --release "${TAG}" \
                --archive /tmp/gmx-ticks.tar.gz --manifest /tmp/gmx-ticks.manifest.json
          fi

          rm -f "$NOTES_FILE"

          echo ""
          echo "=== Release assets ==="
          gh release view "${TAG}" --repo ${{ github.repository }} \
              --json assets --jq '.assets[] | "\(.name)  \(.size / 1024 / 1024 | floor)MB"'

          if [ "${FAILED}" != "0" ]; then
            echo "::error::one or more release uploads failed; see above."
            exit 1
          fi

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RETENTION_DAYS="${{ github.event.inputs.retention_days || 14 }}"
          CUTOFF=$(date -u -d "${RETENTION_DAYS} days ago" +%Y-%m-%d)
          echo "Pruning data-* releases with tag date older than ${CUTOFF}..."

          # The newest release that carries a funding state asset is the only
          # resumable copy of the state, however old it is. It is kept unless a
          # newer release carries one (then that one is kept), i.e. unless a
          # replacement was published successfully. If any inspection fails the
          # answer is "unknown", never "no state": nothing is pruned this run.
          KEEP=""
          if ! RELS=$(gh release list --repo ${{ github.repository }} --limit 100 --json tagName \
              --jq '[.[].tagName | select(test("^data-[0-9]{4}-[0-9]{2}-[0-9]{2}$"))] | sort | reverse | .[]'); then
            echo "::warning::could not list releases; skipping ALL pruning this run."
            exit 0
          fi
          for T in ${RELS}; do
            if ! NAMES=$(gh release view "${T}" --repo ${{ github.repository }} --json assets \
                --jq '.assets[].name'); then
              echo "::warning::could not inspect ${T} for the funding state; skipping ALL pruning this run."
              exit 0
            fi
            if printf '%s\n' "${NAMES}" | grep -qE '^gmx-funding-state-[0-9]{8}T[0-9]{6}Z\.tar\.gz$'; then
              KEEP="${T}"
              break
            fi
          done

          # List releases, filter data-YYYY-MM-DD tags, drop ones older than cutoff
          gh release list --repo ${{ github.repository }} --limit 100 \
              --json tagName --jq '.[].tagName' | \
              grep -E '^data-[0-9]{4}-[0-9]{2}-[0-9]{2}$' | \
              while read -r TAG; do
                  TAG_DATE="${TAG#data-}"
                  if [ "$TAG_DATE" \< "$CUTOFF" ]; then
                      if [ "$TAG" = "$KEEP" ]; then
                          echo "  Keeping ${TAG}: newest release carrying the funding state"
                          continue
                      fi
                      echo "  Deleting ${TAG} (date: ${TAG_DATE})"
                      gh release delete "${TAG}" --repo ${{ github.repository }} --yes --cleanup-tag
                  fi
              done
          echo "Prune complete."

      # Published-but-red, like the cadence step below: the release (OHLCV and
      # everything else) has shipped, and the funding/mark companions in it are
      # either freshly graded or the previous release's, as funding_coverage.json
      # and the release notes state. A gate that never ran counts as a fail.
      - name: Fail job if funding companions were withheld
        if: always()
        run: |
          if [ "${FUNDING_GATE:-fail}" != "pass" ]; then
            echo "ERROR: funding/mark companions were withheld this run; see funding_coverage.json" >&2
            echo "and the 'Funding & Mark Companions' section of data_report.txt." >&2
            exit 1
          fi

      # Deliberately the LAST step in the job. By the time it runs, the
      # annotated manifest has already shipped inside gmx-full.tar.gz and the
      # release exists, so a red run reads as "published, but cadence
      # regressed" rather than "the release failed".
      - name: Fail job if a new cadence regression was not resolved by retry
        if: always()
        run: |
          if [ "${CADENCE_REGRESSION_DETECTED:-false}" = "true" ]; then
            echo "ERROR: this release introduced a new cadence break; see the tracking issue." >&2
            echo "The data was published anyway and the affected manifest entries carry" >&2
            echo "a 'regressed_from' annotation so consumers can quarantine those files." >&2
            exit 1
          fi
          echo "No unresolved cadence regression."
