name: Release GMX Daily Data

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC daily
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Delete releases older than this many days (default: 14).'
        required: false
        default: '14'
      allow_fresh_seed:
        description: 'Allow starting without a previous data release. Only use for the first seed release.'
        required: false
        default: 'false'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # ``contents: write`` is what publishing the release itself needs.
    # ``issues: write`` is the one extra grant: a surviving cadence
    # regression files (or comments on) a tracking issue rather than
    # silently shipping a new hole.
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout code from master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          cache-dependency-glob: 'pyproject.toml'

      - name: Install Python dependencies
        run: |
          uv pip install pandas pyarrow polars rich requests eth-utils "web3-ethereum-defi>=1.1"

      - name: Restore previous release data
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_FRESH_SEED: ${{ github.event.inputs.allow_fresh_seed || 'false' }}
        run: |
          mkdir -p user_data
          TMPDIR=$(mktemp -d)

          PREVIOUS_TAG=$(gh release list \
              --repo ${{ github.repository }} \
              --limit 100 \
              --json tagName \
              --jq '[.[].tagName | select(test("^data-[0-9]{4}-[0-9]{2}-[0-9]{2}$"))] | sort | reverse | .[0] // ""')

          # Later steps need to name the release this run is measured against
          # (the cadence gate records it as `regressed_from`).
          echo "PREVIOUS_TAG=${PREVIOUS_TAG}" >> "$GITHUB_ENV"

          if [ -z "${PREVIOUS_TAG}" ]; then
            if [ "${ALLOW_FRESH_SEED}" = "true" ]; then
              echo "No prior data release exists; allow_fresh_seed=true, continuing with an empty seed."
              rm -rf "${TMPDIR}"
              exit 0
            fi
            echo "ERROR: no prior data release found. Refusing to publish a fresh incomplete snapshot." >&2
            echo "Use workflow_dispatch with allow_fresh_seed=true only for the first seed release." >&2
            exit 1
          fi

          echo "Downloading gmx-full.tar.gz from ${PREVIOUS_TAG}..."
          if gh release download \
              "${PREVIOUS_TAG}" \
              --repo ${{ github.repository }} \
              --pattern "gmx-full.tar.gz" \
              --dir "${TMPDIR}" \
              --clobber; then
              tar -xzf "${TMPDIR}/gmx-full.tar.gz" -C .
              find user_data -name '._*' -delete 2>/dev/null || true
              COUNT=$(find user_data -type f 2>/dev/null | wc -l | tr -d ' ')
              echo "Restored ${COUNT} files from ${PREVIOUS_TAG}."
          else
              echo "ERROR: failed to restore gmx-full.tar.gz from ${PREVIOUS_TAG}." >&2
              exit 1
          fi
          rm -rf "${TMPDIR}"

      # A delisted market (e.g. OM) keeps the history it accumulated while it was
      # live -- collection stops at delisting and the series simply freezes there.
      # Its files are NOT removed: they ride the release lineage so consumers keep
      # the full record. They are only excluded from the integrity gate, because
      # frozen history cannot be repaired by a future collection run and would
      # otherwise block every release forever.
      #
      # The roster lives inside the dataset so it survives release-to-release and
      # still works when the registry API is unreachable. Relisted markets drop
      # back off the roster and resume validation.
      - name: Record delisted markets
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          import re
          from datetime import UTC, datetime
          from pathlib import Path

          from gmx_historical_data.market_registry import get_disabled_market_symbols

          gmx_dir = Path("./user_data/data/gmx")
          futures_dir = gmx_dir / "futures"
          roster_path = gmx_dir / "delisted_markets.json"

          previous: set[str] = set()
          if roster_path.exists():
              previous = {s.upper() for s in json.loads(roster_path.read_text())["symbols"]}

          pattern = re.compile(r"^(.+?)_[^_]+_[^_]+-(?:1m|5m|15m|1h|4h|1d)-")
          symbols = set()
          if futures_dir.is_dir():
              for path in futures_dir.iterdir():
                  match = pattern.match(path.name)
                  if match:
                      symbols.add(match.group(1).upper())

          candidates = sorted(symbols | previous)
          try:
              disabled = {s.upper() for s in get_disabled_market_symbols(candidate_symbols=candidates)}
              live = {s for s in candidates if s not in disabled}
              # Union in the newly delisted, and let anything relisted fall back off.
              roster = sorted((previous | disabled) - live)
              for symbol in sorted(disabled - previous):
                  print(f"newly delisted, freezing history: {symbol}")
              for symbol in sorted(previous & live):
                  print(f"relisted, resuming validation: {symbol}")
          except Exception as exc:  # noqa: BLE001 - never block a release on registry flakiness
              print(f"WARNING: registry unreachable ({exc}); reusing previous roster.")
              roster = sorted(previous)

          gmx_dir.mkdir(parents=True, exist_ok=True)
          roster_path.write_text(
              json.dumps(
                  {"symbols": roster, "updated": datetime.now(UTC).strftime("%Y-%m-%d")},
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          print(f"Delisted roster ({len(roster)}): {', '.join(roster) or '(none)'}")
          print(f"Their history is retained and republished; excluded from the integrity gate only.")
          PY

      - name: Snapshot restored candle history
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          import sys
          from pathlib import Path

          import pandas as pd

          futures_dir = Path("./user_data/data/gmx/futures")
          baseline = {}

          for path in sorted(futures_dir.glob("*.feather")):
              df = pd.read_feather(path, columns=["date"])
              if df.empty:
                  continue
              dates = pd.to_datetime(df["date"], utc=True)
              baseline[path.name] = {
                  "rows": int(len(df)),
                  "min_date": dates.min().isoformat(),
                  "max_date": dates.max().isoformat(),
              }

          if not baseline:
              print("ERROR: restored release contains no candle history to validate.", file=sys.stderr)
              sys.exit(1)

          Path("/tmp/gmx-restore-manifest.json").write_text(
              json.dumps(baseline, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(f"Captured restore manifest for {len(baseline)} futures files.")
          PY

      # Must run BEFORE collection: this run regenerates the manifest in place,
      # so the previous release's copy has to be taken off disk first or there
      # is nothing left to diff against.
      - name: Snapshot restored cadence manifest
        run: |
          BASELINE=./user_data/data/gmx/futures/_cadence_manifest.json
          if [ -f "$BASELINE" ]; then
            cp "$BASELINE" /tmp/gmx-cadence-baseline.json
            echo "Captured cadence baseline from the previous release."
          else
            echo '{"files": {}}' > /tmp/gmx-cadence-baseline.json
            echo "No cadence manifest in the previous release; first run after rollout."
          fi

      - name: Collect daily snapshot
        env:
          JSON_RPC_ARBITRUM: ${{ secrets.JSON_RPC_ARBITRUM }}
          HYPERSYNC_API_TOKEN: ${{ secrets.HYPERSYNC_API_TOKEN }}
        run: |
          PYTHONPATH=src python scripts/collect_daily_snapshot.py --output-dir ./user_data

      - name: Validate candle history integrity
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          import sys
          from pathlib import Path

          import pandas as pd

          baseline_path = Path("/tmp/gmx-restore-manifest.json")
          if not baseline_path.exists():
              print("ERROR: missing restore manifest; cannot validate candle history.", file=sys.stderr)
              sys.exit(1)

          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          futures_dir = Path("./user_data/data/gmx/futures")
          current = {}

          for path in sorted(futures_dir.glob("*.feather")):
              df = pd.read_feather(path, columns=["date"])
              if df.empty:
                  continue
              dates = pd.to_datetime(df["date"], utc=True)
              current[path.name] = {
                  "rows": int(len(df)),
                  "min_date": dates.min().isoformat(),
                  "max_date": dates.max().isoformat(),
              }

          regressions = []

          missing_files = sorted(set(baseline) - set(current))
          if missing_files:
              regressions.append(
                  "missing futures files after collection: " + ", ".join(missing_files[:5])
                  + (" ..." if len(missing_files) > 5 else "")
              )

          for name, before in baseline.items():
              after = current.get(name)
              if not after:
                  continue
              if after["rows"] < before["rows"]:
                  regressions.append(
                      f"{name} row count shrank from {before['rows']} to {after['rows']}"
                  )
              if after["min_date"] > before["min_date"]:
                  regressions.append(
                      f"{name} earliest candle moved forward from {before['min_date']} to {after['min_date']}"
                  )

          report = Path("data_report.txt").read_text(encoding="utf-8") if Path("data_report.txt").exists() else ""
          if "## Failed OHLCV Fetches" in report:
              regressions.append("collector reported failed OHLCV fetches")

          if regressions:
              print("ERROR: release integrity check failed.", file=sys.stderr)
              for item in regressions:
                  print(f"  - {item}", file=sys.stderr)
              sys.exit(1)

          print(f"Validated {len(current)} futures files with no regressions.")
          PY

      - name: Validate futures candle file integrity
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          gmx_dir = Path("./user_data/data/gmx")
          futures_dir = gmx_dir / "futures"
          roster_path = gmx_dir / "delisted_markets.json"

          delisted: set[str] = set()
          if roster_path.exists():
              delisted = {s.upper() for s in json.loads(roster_path.read_text())["symbols"]}

          # Delisted markets keep their frozen history in the release but are not
          # gated on it: collection has stopped, so nothing can ever repair a defect
          # sitting in that frozen tail, and gating on it would block every release.
          pattern = re.compile(r"^(.+?)_[^_]+_[^_]+-(?:1m|5m|15m|1h|4h|1d)-")
          files, skipped = [], 0
          for path in sorted(futures_dir.glob("*-futures.*")):
              if path.suffix not in {".feather", ".parquet"}:
                  continue
              match = pattern.match(path.name)
              if match and match.group(1).upper() in delisted:
                  skipped += 1
                  continue
              files.append(str(path))

          if skipped:
              print(f"Skipping {skipped} file(s) for delisted markets: {', '.join(sorted(delisted))}")

          if not files:
              print("ERROR: no futures candle files found for integrity validation.", file=sys.stderr)
              sys.exit(1)

          cmd = [sys.executable, "scripts/validate_price_continuity.py", "--allow-gaps", *files]
          raise SystemExit(subprocess.call(cmd))
          PY

      # The release pipeline writes its futures feathers via
      # scripts/collect_daily_snapshot.py, not via `export-freqtrade`, so the
      # manifest that FreqtradeExporter.export_candles publishes for local
      # exports is regenerated here from the files actually about to ship.
      # It lands inside gmx-full.tar.gz because the packaging step below tars
      # user_data/data/gmx/ wholesale (issue #29).
      - name: Generate cadence manifest
        run: |
          PYTHONPATH=src python - <<'PY'
          import re
          import sys
          from pathlib import Path

          import polars as pl

          from gmx_historical_data.freqtrade_exporter import FreqtradeExporter
          from gmx_historical_data.ohlcv_validation import (
              find_cadence_breaks,
              parse_timeframe_interval,
          )

          futures_dir = Path("./user_data/data/gmx/futures")
          pattern = re.compile(r"-(1m|5m|15m|1h|4h|1d)-futures\.feather$")

          entries: dict[str, dict] = {}
          for path in sorted(futures_dir.glob("*-futures.feather")):
              match = pattern.search(path.name)
              if match is None:
                  continue
              timeframe = match.group(1)
              expected_interval = parse_timeframe_interval(timeframe)
              frame = pl.read_ipc(path, memory_map=False)
              if frame.is_empty():
                  continue
              breaks = find_cadence_breaks(
                  frame, timestamp_column="date", expected_interval=expected_interval
              )
              entries[path.name] = FreqtradeExporter._cadence_manifest_entry(
                  timeframe,
                  expected_interval,
                  frame.height,
                  frame.get_column("date").min(),
                  frame.get_column("date").max(),
                  breaks,
              )

          if not entries:
              print("ERROR: no futures feathers found to build a cadence manifest.", file=sys.stderr)
              sys.exit(1)

          exporter = FreqtradeExporter(Path("./user_data/data/gmx"), Path("./user_data/data/gmx"))
          manifest_path = exporter.write_cadence_manifest(futures_dir, entries)
          total = sum(e["breaks_total"] for e in entries.values())
          gapped = sum(1 for e in entries.values() if e["breaks_total"])
          print(
              f"Wrote {manifest_path.name}: {len(entries)} files, "
              f"{gapped} with a break, {total} break(s) total."
          )
          PY

      # Detection runs BEFORE packaging/publishing on purpose. A surviving
      # regression does NOT block the release -- starving every consumer of a
      # day of data because one symbol regressed is worse than shipping the
      # regression with a label on it. Instead the offending manifest entry is
      # annotated with `regressed_from`, an issue is filed, and a flag defers
      # the job's failure to the very last step, after publish has succeeded.
      - name: Validate candle cadence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/gmx-cadence-check.py <<'PY'
          import json
          import sys
          from pathlib import Path

          baseline = json.loads(Path("/tmp/gmx-cadence-baseline.json").read_text(encoding="utf-8"))
          current_path = Path("./user_data/data/gmx/futures/_cadence_manifest.json")
          if not current_path.exists():
              print("ERROR: export produced no cadence manifest.", file=sys.stderr)
              sys.exit(1)

          current = json.loads(current_path.read_text(encoding="utf-8"))
          base_files = baseline.get("files", {})
          regressions = []

          for name, entry in sorted(current.get("files", {}).items()):
              before = base_files.get(name)
              if before is None:
                  # New file, or first run after rollout: nothing to compare.
                  continue
              if before.get("truncated") or entry.get("truncated"):
                  # Break lists are incomplete on either side; the totals are
                  # still exact, so fall back to comparing those.
                  if entry["breaks_total"] > before["breaks_total"]:
                      regressions.append(
                          {
                              "file": name,
                              "detail": (
                                  f"{name}: new cadence break (total "
                                  f"{before['breaks_total']} -> {entry['breaks_total']}, "
                                  "truncated lists)"
                              ),
                          }
                      )
                  continue

              known = {(b["before"], b["after"]) for b in before["breaks"]}
              baseline_last = before.get("last")
              for gap in entry["breaks"]:
                  if (gap["before"], gap["after"]) in known:
                      continue
                  if baseline_last is not None and gap["before"] >= baseline_last:
                      # The hole is in territory the previous release did not
                      # cover, so it cannot be a regression against it.
                      continue
                  regressions.append(
                      {
                          "file": name,
                          "detail": (
                              f"{name}: new cadence break - {gap['missing_bars']} bar(s) "
                              f"missing between {gap['before']} and {gap['after']}"
                          ),
                      }
                  )

          Path("/tmp/gmx-cadence-regressions.json").write_text(
              json.dumps(regressions, indent=2), encoding="utf-8"
          )

          if regressions:
              print("ERROR: cadence regressions detected in this release:", file=sys.stderr)
              for item in regressions[:20]:
                  print(f"  - {item['detail']}", file=sys.stderr)
              if len(regressions) > 20:
                  print(f"  ... and {len(regressions) - 20} more", file=sys.stderr)
              # Exit 2 = a real data regression, deterministic across retries.
              # Exit 1 (above) = the check itself could not run.
              sys.exit(2)

          total_breaks = sum(e["breaks_total"] for e in current.get("files", {}).values())
          print(
              f"Cadence OK: {len(current.get('files', {}))} files checked, "
              f"{total_breaks} inherited break(s), 0 new."
          )
          PY

          cat > /tmp/gmx-cadence-annotate.py <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          regressions = json.loads(
              Path("/tmp/gmx-cadence-regressions.json").read_text(encoding="utf-8")
          )
          manifest_path = Path("./user_data/data/gmx/futures/_cadence_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          previous_tag = os.environ.get("PREVIOUS_TAG") or "unknown"

          # Stamp the regression onto the entry itself so a consumer reading
          # only the shipped tarball can quarantine this one file rather than
          # distrusting (or crashing on) the whole release.
          for name in sorted({item["file"] for item in regressions}):
              entry = manifest.get("files", {}).get(name)
              if entry is not None:
                  entry["regressed_from"] = previous_tag

          manifest_path.write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          print(
              f"Annotated {len({i['file'] for i in regressions})} manifest entry(ies) "
              f"with regressed_from={previous_tag}.",
              file=sys.stderr,
          )
          PY

          # Retry re-runs the read-and-diff only, never collection or export:
          # a genuine regression is deterministic and would fail all three
          # attempts identically, so the retry exists purely to absorb a
          # transient read/JSON failure without misreporting it as a data
          # regression. Re-running the export here would mutate published
          # history mid-release for no benefit.
          STATUS=0
          for attempt in 1 2 3; do
            set +e
            PYTHONPATH=src python /tmp/gmx-cadence-check.py
            STATUS=$?
            set -e
            if [ "$STATUS" -eq 0 ]; then
              echo "Cadence check attempt $attempt succeeded."
              break
            fi
            echo "Cadence check attempt $attempt failed (exit ${STATUS})."
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done

          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi

          if [ "$STATUS" -ne 2 ]; then
            echo "ERROR: cadence check could not run after 3 attempts." >&2
            exit 1
          fi

          PYTHONPATH=src python /tmp/gmx-cadence-annotate.py

          REPO=${{ github.repository }}
          RUN_URL="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
          DATE=$(date -u +%Y-%m-%d)
          FILES=$(python -c "import json;print('\n'.join(sorted({i['file'] for i in json.load(open('/tmp/gmx-cadence-regressions.json'))})))")
          DETAILS=$(python -c "import json;print('\n'.join('- '+i['detail'] for i in json.load(open('/tmp/gmx-cadence-regressions.json'))[:50]))")

          # A fleet-wide upstream outage regresses ~107 symbols at once; cap
          # issue churn so one bad night cannot open a hundred tickets.
          FILED=0
          while IFS= read -r FILE; do
            if [ -z "$FILE" ]; then
              continue
            fi
            if [ "$FILED" -ge 10 ]; then
              echo "Issue cap reached; remaining regressions are in the job log and the manifest."
              break
            fi
            BODY="A new cadence break appeared in \`${FILE}\` that the previous release (\`${PREVIOUS_TAG}\`) recorded as contiguous.

          Run: ${RUN_URL}

          ${DETAILS}

          The release still shipped: this file's data is unchanged from before the regression, and its \`_cadence_manifest.json\` entry is annotated with \`\"regressed_from\": \"${PREVIOUS_TAG}\"\` so a consumer can quarantine just this file.

          <!-- cadence-regression:${FILE} -->"
            EXISTING=$(gh issue list --repo "$REPO" --state open --limit 100 \
                --search "in:title cadence regression: ${FILE}" \
                --json number --jq '.[0].number // ""' 2>/dev/null || echo "")
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY" \
                || echo "WARNING: could not comment on issue #${EXISTING}" >&2
              echo "Commented on existing issue #${EXISTING} for ${FILE}."
            else
              gh issue create --repo "$REPO" \
                  --title "cadence regression: ${FILE} — ${DATE}" \
                  --assignee Aviksaikat \
                  --label bug \
                  --body "$BODY" \
                || echo "WARNING: could not file an issue for ${FILE}" >&2
            fi
            FILED=$((FILED + 1))
          done <<< "$FILES"

          # Defer the failure: publish must still run so consumers get the
          # day's data. The last step in this job turns this flag into exit 1.
          echo "CADENCE_REGRESSION_DETECTED=true" >> "$GITHUB_ENV"
          echo "::warning::New cadence break(s) detected; the release will publish and the job will end red."

      - name: Collect 24h volume snapshot
        run: |
          PYTHONPATH=src python - <<'EOF'
          import sys
          from datetime import datetime, UTC
          from pathlib import Path
          from gmx_historical_data.subsquid_volume import fetch_daily_volumes
          import pandas as pd

          date_str = datetime.now(UTC).strftime("%Y-%m-%d")
          volumes_dir = Path("./user_data/data/gmx/volumes")
          volumes_dir.mkdir(parents=True, exist_ok=True)

          print(f"Fetching 24h volumes for {date_str}...")
          volumes = fetch_daily_volumes(chain="arbitrum")
          if not volumes:
              print("No volume data returned.")
              sys.exit(0)

          rows = [{"date": date_str, "market_address": addr, "volume_usd": str(vol)} for addr, vol in volumes.items()]
          df = pd.DataFrame(rows)
          out = volumes_dir / f"{date_str}.parquet"
          df.to_parquet(out, index=False)
          print(f"Saved {len(df)} markets -> {out}")
          EOF

      - name: Show report in job summary
        if: always()
        run: |
          if [ -f data_report.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat data_report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No report generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Package tarballs
        run: |
          set -e
          if [ ! -d user_data/data/gmx ]; then
            echo "user_data/data/gmx/ missing after collection — aborting" >&2
            exit 1
          fi

          mkdir -p user_data/data/gmx/volumes

          tar -czf /tmp/gmx-full.tar.gz user_data/data/gmx/
          tar -czf /tmp/gmx-light.tar.gz \
              user_data/data/gmx/apy/ \
              user_data/data/gmx/snapshots/ \
              user_data/data/gmx/tickers/ \
              user_data/data/gmx/volumes/

          ls -lh /tmp/gmx-*.tar.gz

          # Asset size guardrails
          for tarball in /tmp/gmx-full.tar.gz /tmp/gmx-light.tar.gz; do
            size=$(stat -c %s "$tarball")
            limit=$((2 * 1024 * 1024 * 1024))  # 2 GB
            if [ "$size" -ge "$limit" ]; then
              echo "ERROR: $tarball is ${size} bytes — exceeds 2 GB GitHub asset cap" >&2
              exit 1
            fi
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          TAG="data-${DATE}"
          COUNT=$(find user_data/data/gmx -type f 2>/dev/null | wc -l | tr -d ' ')

          # Idempotent: if today's release already exists (re-run), delete it first
          gh release delete "${TAG}" --repo ${{ github.repository }} --yes 2>/dev/null || true
          git push origin --delete "${TAG}" 2>/dev/null || true

          NOTES_FILE=$(mktemp)
          cat > "$NOTES_FILE" <<NOTES
          Daily automated GMX data snapshot.

          **Generated:** ${TIMESTAMP} UTC

          Contents (${COUNT} files total):
          - \`gmx-full.tar.gz\` — apy/, snapshots/, tickers/, volumes/, futures/
          - \`gmx-light.tar.gz\` — apy/, snapshots/, tickers/, volumes/ (no futures/)
          - \`data_report.txt\` — collection summary

          Consume with \`scripts/download_gmx_data.sh\` (see repo README).
          NOTES

          ASSETS=(/tmp/gmx-full.tar.gz /tmp/gmx-light.tar.gz)
          if [ -f data_report.txt ]; then
            ASSETS+=(data_report.txt)
          fi

          gh release create "${TAG}" \
              --repo ${{ github.repository }} \
              --title "GMX Data ${DATE}" \
              --notes-file "$NOTES_FILE" \
              --latest \
              "${ASSETS[@]}"

          rm -f "$NOTES_FILE"

          echo ""
          echo "=== Release assets ==="
          gh release view "${TAG}" --repo ${{ github.repository }} \
              --json assets --jq '.assets[] | "\(.name)  \(.size / 1024 / 1024 | floor)MB"'

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RETENTION_DAYS="${{ github.event.inputs.retention_days || 14 }}"
          CUTOFF=$(date -u -d "${RETENTION_DAYS} days ago" +%Y-%m-%d)
          echo "Pruning data-* releases with tag date older than ${CUTOFF}..."

          # List releases, filter data-YYYY-MM-DD tags, drop ones older than cutoff
          gh release list --repo ${{ github.repository }} --limit 100 \
              --json tagName --jq '.[].tagName' | \
              grep -E '^data-[0-9]{4}-[0-9]{2}-[0-9]{2}$' | \
              while read -r TAG; do
                  TAG_DATE="${TAG#data-}"
                  if [ "$TAG_DATE" \< "$CUTOFF" ]; then
                      echo "  Deleting ${TAG} (date: ${TAG_DATE})"
                      gh release delete "${TAG}" --repo ${{ github.repository }} --yes --cleanup-tag
                  fi
              done
          echo "Prune complete."

      # Deliberately the LAST step in the job. By the time it runs, the
      # annotated manifest has already shipped inside gmx-full.tar.gz and the
      # release exists, so a red run reads as "published, but cadence
      # regressed" rather than "the release failed".
      - name: Fail job if a new cadence regression was not resolved by retry
        if: always()
        run: |
          if [ "${CADENCE_REGRESSION_DETECTED:-false}" = "true" ]; then
            echo "ERROR: this release introduced a new cadence break; see the tracking issue." >&2
            echo "The data was published anyway and the affected manifest entries carry" >&2
            echo "a 'regressed_from' annotation so consumers can quarantine those files." >&2
            exit 1
          fi
          echo "No unresolved cadence regression."
