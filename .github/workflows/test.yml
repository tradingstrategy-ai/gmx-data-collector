name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pinned to the same range as the `dev` dependency group in
      # pyproject.toml. The lint below covers the whole repo, so an
      # unpinned ruff picking up a new minor release could fail CI on
      # files the PR never touched.
      - name: Install ruff
        run: pip install 'ruff>=0.14.14,<0.15.0'

      # Whole repo, not just src/ + tests/: scripts/ and notebooks/ were
      # unlinted for long enough to accumulate a genuine undefined name.
      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y capnproto

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run unit tests
        env:
          JSON_RPC_ARBITRUM: "https://arb1.arbitrum.io/rpc"
        run: |
          poetry run python -m pytest tests/ -v \
            --ignore=tests/test_hybrid_collection.py \
            --ignore=tests/test_gmx_event_collector.py \
            --ignore=tests/test_integration_event_based.py \
            --ignore=tests/test_integration_gmx_first.py \
            --ignore=tests/test_gmx_market_mapper.py \
            --ignore=tests/test_gmx_token_discovery.py \
            --ignore=tests/test_live_funding.py \
            -x

  # The unit-tests job installs the full dev environment via Poetry, so it
  # cannot catch a dependency the *release* is missing -- that is exactly how
  # two scheduled releases died at import time while CI stayed green
  # (2026-09-11/12). This job installs what the daily collector installs,
  # byte for byte, and does nothing but import the entry points.
  collector-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Same uv setup and Python version as release-data.yml, so this
      # reproduces the release environment rather than an approximation.
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          cache-dependency-glob: 'requirements-collector.txt'

      - name: Install collector dependencies
        run: uv pip install -r requirements-collector.txt

      - name: Import every collector entry point
        run: python scripts/smoke_imports.py

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y capnproto

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run integration tests
        env:
          JSON_RPC_ARBITRUM: ${{ secrets.JSON_RPC_ARBITRUM }}
          HYPERSYNC_API_TOKEN: ${{ secrets.HYPERSYNC_API_TOKEN }}
        run: |
          poetry run python -m pytest tests/ -v \
            --ignore=tests/test_gmx_market_mapper.py \
            --ignore=tests/test_integration_event_based.py
