[tool.poetry]
name = "gmx-historical-data"
version = "0.0.1"
description = ""
authors = ["Saikat <saikat@tradingstrategy.ai>"]
readme = "README.md"
packages = [{ include = "gmx_historical_data", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
hypersync = "0.8"
web3 = ">=7.14.0"
pyarrow = ">=23.0.0"
pandas = ">=3.0.0"
eth-abi = ">=5.2.0"
matplotlib = ">=3.10.8"
web3-ethereum-defi = ">=0.39.0"
typer = ">=0.15.1"
rich = ">=13.9.4"
schedule = ">=1.2.0"
aiohttp = ">=3.9.0"
polars = "^1.38.1"
plotly = "^6.6.0"
jupyterlab = "^4.5.5"

[tool.poetry.scripts]
gmx_historical_data = "gmx_historical_data.cli:main"
plot-gmx-data = "gmx_historical_data.plot_data:main"
gmx-periodic-collector = "gmx_historical_data.daemon.periodic_collector:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "UP007",  # use X | Y instead of Optional — too noisy for existing code
]

[tool.ruff.lint.isort]
known-first-party = ["gmx_historical_data"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "ruff (>=0.14.14,<0.15.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
]
